apiVersion: v1
kind: Service
metadata:
  name: httpbin-stable
  namespace: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - port: 8000
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-canary
  namespace: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - port: 8000
      targetPort: 80
