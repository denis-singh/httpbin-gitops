apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
spec:
  parentRefs:
    - name: http
      namespace: gloo-system
  hostnames:
    - "httpbin.denissingh.com"
  rules:
    - filters:  
      - type: ExtensionRef
        extensionRef:
          group: gateway.solo.io
          kind: RouteOption
          name: ratelimit
    - backendRefs:
        - name: httpbin-stable
          port: 8000
          weight: 100
        - name: httpbin-canary
          port: 8000
          weight: 0
