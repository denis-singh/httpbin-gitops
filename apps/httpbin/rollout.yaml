apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: httpbin
  namespace: httpbin
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
      annotations:
        release: "5"
    spec:
      containers:
        - name: httpbin
          image: kennethreitz/httpbin:latest   # pin a tag or your own image; image changes drive rollouts
          ports:
            - containerPort: 80
          env:
            - name: APP_VERSION
              value: "v5"
  strategy:
    canary:
      stableService: httpbin-stable
      canaryService: httpbin-canary
      trafficRouting:
        managedRoutes:
          - name: canary-header-route
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: httpbin
            namespace: httpbin
      steps:
        - setCanaryScale:
            replicas: 1
        - setHeaderRoute:
            name: canary-header-route
            match:
              - headerName: x-canary
                headerValue:
                  exact: "true"
        - pause: {}              # test with the header here, 0% real traffic
        - setWeight: 20
        - pause: {}
        - setWeight: 50
        - pause: {duration: 60s}
        - setHeaderRoute:
            name: canary-header-route   # no match = remove the header route
